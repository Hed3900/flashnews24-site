<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FlashNews24 - Breaking News</title>

  <meta
    name="description"
    content="FlashNews24 brings breaking news, world news, India news, politics, business, sports, technology and entertainment updates."
  />

  <link rel="icon" href="/favicon.svg" />

  <script>
(function(l) {
  if (l.search[1] === 'p') {
    var decoded = l.search
      .slice(3)
      .replace(/~and~/g, '&');

    window.history.replaceState(
      null,
      null,
      l.pathname.slice(0, -1) +
        decoded +
        l.hash
    );
  }
}(window.location));
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
